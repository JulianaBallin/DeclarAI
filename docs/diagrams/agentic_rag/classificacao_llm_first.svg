<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0F766E"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F97316"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#F8FAFC"/>

  <!-- Título -->
  <text x="400" y="34" font-size="17" font-weight="700" fill="#0F766E" text-anchor="middle">Classificação LLM-first com Fallback por Regras</text>
  <line x1="80" y1="46" x2="720" y2="46" stroke="#0F766E" stroke-width="1.2" opacity="0.2"/>

  <!-- INICIO: Documento enviado -->
  <rect x="300" y="58" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="400" y="80" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">Documento Enviado</text>
  <text x="400" y="98" font-size="10" fill="#64748B" text-anchor="middle">PDF | TXT | HTML | JPG | PNG</text>

  <!-- Seta para extração -->
  <line x1="400" y1="110" x2="400" y2="134" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Extração de texto -->
  <rect x="300" y="134" width="200" height="48" rx="8" fill="#E8F5F4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="400" y="154" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">Extração de Texto</text>
  <text x="400" y="170" font-size="9.5" fill="#0B4F4A" text-anchor="middle">pdfplumber | BeautifulSoup | OCR</text>

  <!-- Seta para LLM -->
  <line x1="400" y1="182" x2="400" y2="206" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- LLM Classifier -->
  <rect x="290" y="206" width="220" height="60" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2.2"/>
  <text x="400" y="230" font-size="11" font-weight="700" fill="#F97316" text-anchor="middle">Classificador LLM (Mistral)</text>
  <text x="400" y="248" font-size="10" fill="#92400E" text-anchor="middle">prompt estruturado com texto</text>
  <text x="400" y="262" font-size="10" fill="#92400E" text-anchor="middle">extraído do documento</text>

  <!-- Seta para decisão -->
  <line x1="400" y1="266" x2="400" y2="292" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Losango de decisão -->
  <polygon points="400,292 490,320 400,348 310,320" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="400" y="316" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">Categoria</text>
  <text x="400" y="331" font-size="10" fill="#64748B" text-anchor="middle">válida?</text>

  <!-- Caminho SIM (direita) -->
  <line x1="490" y1="320" x2="570" y2="320" stroke="#0F766E" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="526" y="312" font-size="10" fill="#0F766E" font-weight="700">SIM</text>

  <rect x="570" y="296" width="190" height="48" rx="8" fill="#E8F5F4" stroke="#0F766E" stroke-width="2"/>
  <text x="665" y="316" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">Usa resultado do LLM</text>
  <text x="665" y="332" font-size="9.5" fill="#0B4F4A" text-anchor="middle">origem: "llm"</text>

  <!-- Caminho NÃO (esquerda) -->
  <line x1="310" y1="320" x2="230" y2="320" stroke="#F97316" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="264" y="312" font-size="10" fill="#F97316" font-weight="700">NÃO</text>

  <rect x="40" y="296" width="190" height="48" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="135" y="316" font-size="10.5" font-weight="700" fill="#F97316" text-anchor="middle">Fallback por Regras</text>
  <text x="135" y="332" font-size="9.5" fill="#92400E" text-anchor="middle">busca palavras-chave</text>

  <!-- Setas convergindo para resultado -->
  <line x1="135" y1="344" x2="135" y2="388" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="135" y1="388" x2="294" y2="400" stroke="#64748B" stroke-width="1.3"/>
  <line x1="665" y1="344" x2="665" y2="388" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="665" y1="388" x2="506" y2="400" stroke="#64748B" stroke-width="1.3"/>

  <!-- Resultado final -->
  <rect x="294" y="390" width="212" height="58" rx="10" fill="#E8F5F4" stroke="#0F766E" stroke-width="2.2"/>
  <text x="400" y="412" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">Resultado Final</text>
  <text x="400" y="430" font-size="10" fill="#0B4F4A" text-anchor="middle">categoria + origem_classificação</text>
  <text x="400" y="446" font-size="9.5" fill="#64748B" text-anchor="middle">ativa justificativa enriquecida</text>

  <!-- Campo origem_classificação explicado -->
  <rect x="40" y="378" width="190" height="36" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1"/>
  <text x="135" y="394" font-size="9" fill="#92400E" text-anchor="middle" font-weight="700">origem_classificação:</text>
  <text x="135" y="408" font-size="9" fill="#92400E" text-anchor="middle">"llm" ou "regras"</text>

  <rect x="570" y="378" width="190" height="36" rx="6" fill="#E8F5F4" stroke="#0F766E" stroke-width="1"/>
  <text x="665" y="394" font-size="9" fill="#0B4F4A" text-anchor="middle" font-weight="700">campos disponíveis:</text>
  <text x="665" y="408" font-size="9" fill="#0B4F4A" text-anchor="middle">categoria, confiança, motivo</text>
</svg>
