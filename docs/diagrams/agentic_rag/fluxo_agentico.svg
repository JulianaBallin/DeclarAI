<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0F766E"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F97316"/>
    </marker>
  </defs>

  <rect width="800" height="580" fill="#F8FAFC"/>

  <!-- Título -->
  <text x="400" y="34" font-size="17" font-weight="700" fill="#0F766E" text-anchor="middle">Fluxo Agêntico - DeclarAI</text>
  <line x1="80" y1="44" x2="720" y2="44" stroke="#0F766E" stroke-width="1.2" opacity="0.2"/>

  <!-- Usuário -->
  <ellipse cx="400" cy="82" rx="78" ry="28" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="400" y="87" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">Usuário (Frontend)</text>

  <!-- Seta usuário -> dispatcher -->
  <line x1="400" y1="110" x2="400" y2="136" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Dispatcher / Orquestrador -->
  <polygon points="400,136 520,172 400,208 280,172" fill="#E8F5F4" stroke="#0F766E" stroke-width="2"/>
  <text x="400" y="168" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">Orquestrador</text>
  <text x="400" y="183" font-size="10" fill="#0B4F4A" text-anchor="middle">Detecção de Intenção</text>

  <!-- 3 setas para as 3 ferramentas -->
  <!-- Seta para Chat RAG (esquerda) -->
  <line x1="285" y1="172" x2="186" y2="240" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrT)"/>
  <text x="210" y="220" font-size="9" fill="#0F766E">pergunta</text>

  <!-- Seta para Upload (centro) -->
  <line x1="400" y1="208" x2="400" y2="258" stroke="#F97316" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="408" y="240" font-size="9" fill="#F97316">upload</text>

  <!-- Seta para Histórico (direita) -->
  <line x1="515" y1="172" x2="614" y2="240" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="570" y="220" font-size="9" fill="#64748B">histórico</text>

  <!-- ===== FERRAMENTA 1: Chat RAG ===== -->
  <rect x="30" y="258" width="228" height="172" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <rect x="30" y="258" width="228" height="30" rx="10" fill="#0F766E"/>
  <rect x="30" y="278" width="228" height="10" rx="0" fill="#0F766E"/>
  <text x="144" y="279" font-size="11" font-weight="700" fill="white" text-anchor="middle">Ferramenta 1: Chat RAG</text>

  <text x="50" y="310" font-size="10" fill="#172033">1. Embedding da pergunta</text>
  <text x="50" y="328" font-size="10" fill="#172033">2. Busca ChromaDB (top-15)</text>
  <text x="50" y="346" font-size="10" fill="#172033">3. Re-ranking CrossEncoder</text>
  <text x="50" y="364" font-size="10" fill="#172033">4. Gera resposta (Mistral)</text>
  <text x="50" y="382" font-size="10" fill="#172033">5. Retorna fontes citadas</text>
  <text x="50" y="400" font-size="9.5" fill="#64748B">Resultado: resposta + score</text>
  <text x="50" y="415" font-size="9.5" fill="#64748B">de similaridade + chunks</text>

  <!-- ===== FERRAMENTA 2: Upload ===== -->
  <rect x="286" y="258" width="228" height="200" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <rect x="286" y="258" width="228" height="30" rx="10" fill="#F97316"/>
  <rect x="286" y="278" width="228" height="10" rx="0" fill="#F97316"/>
  <text x="400" y="279" font-size="11" font-weight="700" fill="white" text-anchor="middle">Ferramenta 2: Upload Fiscal</text>

  <text x="306" y="310" font-size="10" fill="#172033">1. Extração do texto</text>
  <text x="306" y="328" font-size="10" fill="#172033">2. Classificação LLM-first</text>
  <text x="306" y="346" font-size="10" fill="#172033">   + fallback por regras</text>
  <text x="306" y="364" font-size="10" fill="#172033">3. Verificação de titularidade</text>
  <text x="306" y="382" font-size="10" fill="#172033">   (declarante vs. terceiro)</text>
  <text x="306" y="400" font-size="10" fill="#172033">4. Justificativa enriquecida</text>
  <text x="306" y="418" font-size="10" fill="#172033">   (2º pipeline RAG)</text>
  <text x="306" y="440" font-size="9.5" fill="#64748B">Resultado: categoria + aviso</text>

  <!-- ===== FERRAMENTA 3: Histórico ===== -->
  <rect x="542" y="258" width="228" height="172" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="542" y="258" width="228" height="30" rx="10" fill="#475569"/>
  <rect x="542" y="278" width="228" height="10" rx="0" fill="#475569"/>
  <text x="656" y="279" font-size="11" font-weight="700" fill="white" text-anchor="middle">Ferramenta 3: Histórico</text>

  <text x="562" y="310" font-size="10" fill="#172033">1. Consulta SQLite</text>
  <text x="562" y="328" font-size="10" fill="#172033">2. Filtros: categoria, data</text>
  <text x="562" y="346" font-size="10" fill="#172033">3. Resumo por categorias</text>
  <text x="562" y="364" font-size="10" fill="#172033">4. Exclusão de documentos</text>
  <text x="562" y="400" font-size="9.5" fill="#64748B">Resultado: lista paginada</text>
  <text x="562" y="415" font-size="9.5" fill="#64748B">de documentos salvos</text>

  <!-- ===== CAMADA DE INFRAESTRUTURA ===== -->
  <rect x="30" y="470" width="740" height="90" rx="10" fill="#E8F5F4" stroke="#0F766E" stroke-width="1.5"/>
  <text x="400" y="492" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">Infraestrutura Compartilhada</text>
  <line x1="50" y1="500" x2="750" y2="500" stroke="#0F766E" stroke-width="0.8" opacity="0.3"/>

  <!-- 4 componentes de infra -->
  <rect x="50" y="508" width="148" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="124" y="524" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">ChromaDB</text>
  <text x="124" y="539" font-size="9" fill="#64748B" text-anchor="middle">banco vetorial (cosine)</text>

  <rect x="210" y="508" width="148" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="284" y="524" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">Ollama (Mistral)</text>
  <text x="284" y="539" font-size="9" fill="#64748B" text-anchor="middle">LLM local | temp. 0.1</text>

  <rect x="370" y="508" width="148" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="444" y="524" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">SQLite + SQLAlchemy</text>
  <text x="444" y="539" font-size="9" fill="#64748B" text-anchor="middle">histórico de documentos</text>

  <rect x="530" y="508" width="210" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="635" y="524" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">MiniLM-L12-v2 + CrossEncoder</text>
  <text x="635" y="539" font-size="9" fill="#64748B" text-anchor="middle">embeddings + re-ranking</text>

  <!-- Setas das ferramentas para infra -->
  <line x1="144" y1="430" x2="144" y2="470" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="400" y1="458" x2="400" y2="470" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="656" y1="430" x2="656" y2="470" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>
