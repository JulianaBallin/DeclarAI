<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="título desc">
  <title id="título">Fluxo de titularidade e justificativa do DeclaraAI</title>
  <desc id="desc">Fluxo agentic do upload fiscal, classificação, titularidade, justificativa RAG e revisão pelo usuário.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748B"/>
    </marker>
    <marker id="setaLaranja" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#F97316"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAF9F6"/>
  <text x="450" y="38" font-size="22" font-weight="800" fill="#172033" text-anchor="middle">Fluxo Agentic de Upload Fiscal</text>
  <text x="450" y="62" font-size="12" fill="#64748B" text-anchor="middle">Classificação LLM-first, titularidade e justificativa enriquecida com RAG</text>

  <rect x="52" y="92" width="168" height="78" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="136" y="122" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Documento</text>
  <text x="136" y="144" font-size="11" fill="#64748B" text-anchor="middle">PDF, XML, HTML, TXT</text>
  <text x="136" y="160" font-size="11" fill="#64748B" text-anchor="middle">JPG ou PNG</text>

  <line x1="220" y1="131" x2="276" y2="131" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="276" y="92" width="168" height="78" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="360" y="122" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Extração</text>
  <text x="360" y="144" font-size="11" fill="#0B4F4A" text-anchor="middle">texto + metadados</text>
  <text x="360" y="160" font-size="11" fill="#0B4F4A" text-anchor="middle">valor, data, beneficiário</text>

  <line x1="444" y1="131" x2="500" y2="131" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="500" y="92" width="168" height="78" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="584" y="122" font-size="13" font-weight="800" fill="#F97316" text-anchor="middle">Classificação</text>
  <text x="584" y="144" font-size="11" fill="#92400E" text-anchor="middle">Mistral primeiro</text>
  <text x="584" y="160" font-size="11" fill="#92400E" text-anchor="middle">fallback por regras</text>

  <line x1="584" y1="170" x2="584" y2="218" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <polygon points="584,218 702,268 584,318 466,268" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="584" y="258" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Beneficiário</text>
  <text x="584" y="278" font-size="11" fill="#64748B" text-anchor="middle">é titular ou dependente?</text>

  <line x1="466" y1="268" x2="342" y2="268" stroke="#0F766E" stroke-width="2" marker-end="url(#seta)"/>
  <text x="390" y="252" font-size="10" fill="#0F766E" text-anchor="middle">sim ou provável</text>

  <rect x="96" y="230" width="246" height="88" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="219" y="258" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Documento Aceitável</text>
  <text x="219" y="280" font-size="11" fill="#0B4F4A" text-anchor="middle">segue para justificativa</text>
  <text x="219" y="296" font-size="11" fill="#0B4F4A" text-anchor="middle">aviso quando dependente</text>
  <text x="219" y="312" font-size="11" fill="#0B4F4A" text-anchor="middle">exigir confirmação</text>

  <line x1="702" y1="268" x2="790" y2="268" stroke="#F97316" stroke-width="2" marker-end="url(#setaLaranja)"/>
  <text x="746" y="252" font-size="10" fill="#F97316" text-anchor="middle">terceiro</text>

  <rect x="790" y="230" width="72" height="76" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="826" y="258" font-size="13" font-weight="800" fill="#F97316" text-anchor="middle">Aviso</text>
  <text x="826" y="280" font-size="10" fill="#92400E" text-anchor="middle">não salvar</text>
  <text x="826" y="296" font-size="10" fill="#92400E" text-anchor="middle">sem revisar</text>

  <line x1="219" y1="318" x2="219" y2="356" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="826" y1="306" x2="826" y2="356" stroke="#F97316" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#setaLaranja)"/>

  <rect x="80" y="356" width="280" height="88" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="220" y="386" font-size="13" font-weight="800" fill="#172033" text-anchor="middle">Justificativa Enriquecida</text>
  <text x="220" y="408" font-size="11" fill="#64748B" text-anchor="middle">consulta top-3 por categoria</text>
  <text x="220" y="424" font-size="11" fill="#64748B" text-anchor="middle">explicação normativa personalizada</text>

  <line x1="360" y1="400" x2="470" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="470" y="356" width="180" height="88" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="560" y="386" font-size="13" font-weight="800" fill="#F97316" text-anchor="middle">Revisão Humana</text>
  <text x="560" y="408" font-size="11" fill="#92400E" text-anchor="middle">usuário confere dados</text>
  <text x="560" y="424" font-size="11" fill="#92400E" text-anchor="middle">antes de salvar</text>

  <line x1="650" y1="400" x2="758" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="758" y="356" width="104" height="88" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="810" y="386" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Histórico</text>
  <text x="810" y="408" font-size="11" fill="#0B4F4A" text-anchor="middle">SQLite</text>
  <text x="810" y="424" font-size="11" fill="#0B4F4A" text-anchor="middle">+ ChromaDB</text>

  <rect x="80" y="480" width="782" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="104" y="501" font-size="12" fill="#172033">Resultado esperado: categoria auditável, risco de titularidade destacado e justificativa fundamentada.</text>
  <text x="104" y="517" font-size="12" fill="#172033">O documento só é salvo após confirmação explícita do usuário.</text>
</svg>
