<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgAv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a6b3c"/>
      <stop offset="100%" style="stop-color:#15803D"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b3a00"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b5800"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bgAv)"/>
  <rect width="900" height="480" fill="none" stroke="#FF6B35" stroke-width="1.2" opacity="0.3"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#0F766E">Avaliação do Pipeline RAG - DeclarAI</text>
  <line x1="50" y1="40" x2="850" y2="40" stroke="#FF6B35" stroke-width="0.8" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="450" y="58" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748B">60 perguntas anotadas cobrindo: Obrigatoriedade • Deduções Médicas • Educação • Previdência • Penalidades • Autônomos • Dependentes</text>

  <!-- ===== METRIC 1: TAXA DE RECUPERAÇÃO ===== -->
  <rect x="40" y="72" width="810" height="68" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/>

  <!-- Label -->
  <text x="62" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#15803D">Taxa de Recuperação</text>
  <text x="62" y="112" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748B">% de perguntas com ao menos 1 chunk relevante recuperado</text>

  <!-- Bar track -->
  <rect x="290" y="82" width="440" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Bar fill: 100% -->
  <rect x="290" y="82" width="440" height="22" rx="4" fill="url(#barGreen)" opacity="0.85"/>
  <!-- Value label -->
  <text x="742" y="98" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#15803D">100%</text>
  <text x="742" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">60/60 perguntas</text>
  <!-- Stars -->
  <text x="820" y="103" font-size="18">🟢</text>

  <!-- ===== METRIC 2: SCORE MÉDIO DE CONTEXTO ===== -->
  <rect x="40" y="156" width="810" height="68" rx="8" fill="#FFFFFF" stroke="#FF6B35" stroke-width="1.6"/>

  <text x="62" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FF6B35">Score Médio de Contexto</text>
  <text x="62" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748B">Similaridade cosseno média dos chunks retornados (0-1)</text>

  <!-- Bar track -->
  <rect x="290" y="166" width="440" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Bar fill: ~0.61 of 1.0 = 268px -->
  <rect x="290" y="166" width="268" height="22" rx="4" fill="url(#barOrange)" opacity="0.85"/>
  <!-- Tick marks -->
  <line x1="378" y1="163" x2="378" y2="191" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="466" y1="163" x2="466" y2="191" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="554" y1="163" x2="554" y2="191" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="642" y1="163" x2="642" y2="191" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="378" y="199" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">0.2</text>
  <text x="466" y="199" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">0.4</text>
  <text x="554" y="199" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">0.6</text>
  <text x="642" y="199" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">0.8</text>
  <text x="742" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#FF6B35">~0.61</text>
  <text x="742" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">média geral</text>
  <text x="820" y="187" font-size="18">🟡</text>

  <!-- ===== METRIC 3: COBERTURA DE KEYWORDS ===== -->
  <rect x="40" y="240" width="810" height="68" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>

  <text x="62" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#0F766E">Cobertura de Keywords</text>
  <text x="62" y="280" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#64748B">% de termos-chave esperados presentes na resposta gerada pelo LLM</text>

  <!-- Bar track -->
  <rect x="290" y="250" width="440" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Bar fill: ~75% = 330px -->
  <rect x="290" y="250" width="330" height="22" rx="4" fill="url(#barYellow)" opacity="0.85"/>
  <line x1="378" y1="247" x2="378" y2="275" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="466" y1="247" x2="466" y2="275" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="554" y1="247" x2="554" y2="275" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="642" y1="247" x2="642" y2="275" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="378" y="283" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">25%</text>
  <text x="466" y="283" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">50%</text>
  <text x="554" y="283" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">75%</text>
  <text x="642" y="283" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#64748B">100%</text>
  <text x="742" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0F766E">~75%</text>
  <text x="742" y="284" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">pipeline LLM</text>
  <text x="820" y="271" font-size="18">🟡</text>

  <!-- ===== ANÁLISE DE CASOS ===== -->
  <rect x="40" y="326" width="810" height="114" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="62" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#172033">Dataset de Teste (60 perguntas)</text>
  <line x1="60" y1="354" x2="828" y2="354" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Case rows -->
  <text x="70" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="88" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Obrigatoriedade de declarar</text>
  <text x="70" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="88" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Deduções médicas e dentistas</text>
  <text x="70" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="88" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Limite de educação (R$ 3.561,50)</text>
  <text x="70" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="88" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Simplificada vs. Completa</text>

  <text x="340" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="358" y="370" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Como funciona o PGBL</text>
  <text x="340" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="358" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Multas e penalidades por atraso</text>
  <text x="340" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="358" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Carnê-leão para autônomos</text>
  <text x="340" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#15803D">✅</text>
  <text x="358" y="415" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" fill="#172033">Como incluir dependentes</text>

  <!-- Nota sobre avaliação -->
  <rect x="600" y="362" width="228" height="64" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="0.8" opacity="0.9"/>
  <text x="714" y="378" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#0F766E">Inspirado no RAGAS</text>
  <text x="614" y="394" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#172033">• Context Precision (bi-encoder)</text>
  <text x="614" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#172033">• Answer Relevancy (keywords)</text>
  <text x="614" y="422" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#172033">• Faithfulness (sem LLM judge)</text>

  <!-- Footer note -->
  <rect x="40" y="450" width="810" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="450" y="463" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748B">Avaliação executada via POST /evaluation/recuperacao (sem LLM) e POST /evaluation/completa (com LLM) - ambos disponíveis na interface</text>
</svg>
