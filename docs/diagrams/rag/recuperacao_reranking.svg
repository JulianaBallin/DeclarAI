<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="título desc">
  <title id="título">Recuperação e re-ranking do DeclarAI</title>
  <desc id="desc">Fluxo claro da pergunta do usuário até a resposta gerada pelo LLM com fontes e scores.</desc>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748B"/>
    </marker>
    <marker id="setaLaranja" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#F97316"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#FAF9F6"/>
  <text x="450" y="38" font-size="22" font-weight="800" fill="#172033" text-anchor="middle">Recuperação RAG com Re-ranking</text>
  <text x="450" y="62" font-size="12" fill="#64748B" text-anchor="middle">Busca semântica, reordenação contextual e resposta fundamentada com fontes</text>

  <rect x="40" y="96" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="115" y="126" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Pergunta</text>
  <text x="115" y="148" font-size="11" fill="#64748B" text-anchor="middle">texto livre</text>
  <text x="115" y="164" font-size="11" fill="#64748B" text-anchor="middle">do usuário</text>

  <line x1="190" y1="139" x2="238" y2="139" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="238" y="96" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="313" y="126" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Embedding</text>
  <text x="313" y="148" font-size="11" fill="#64748B" text-anchor="middle">MiniLM</text>
  <text x="313" y="164" font-size="11" fill="#64748B" text-anchor="middle">384 dimensões</text>

  <line x1="388" y1="139" x2="436" y2="139" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="436" y="96" width="150" height="86" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="511" y="126" font-size="13" font-weight="800" fill="#F97316" text-anchor="middle">ChromaDB</text>
  <text x="511" y="148" font-size="11" fill="#92400E" text-anchor="middle">top-15</text>
  <text x="511" y="164" font-size="11" fill="#92400E" text-anchor="middle">candidatos</text>

  <line x1="586" y1="139" x2="634" y2="139" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="634" y="96" width="210" height="86" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="739" y="126" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">CrossEncoder</text>
  <text x="739" y="148" font-size="11" fill="#0B4F4A" text-anchor="middle">avalia pergunta + trecho</text>
  <text x="739" y="164" font-size="11" fill="#0B4F4A" text-anchor="middle">retorna top-5 finais</text>

  <line x1="739" y1="182" x2="739" y2="230" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="604" y="230" width="270" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="739" y="258" font-size="13" font-weight="800" fill="#172033" text-anchor="middle">Contexto Montado</text>
  <text x="739" y="280" font-size="11" fill="#64748B" text-anchor="middle">trechos separados por fonte</text>
  <text x="739" y="296" font-size="11" fill="#64748B" text-anchor="middle">scores preservados para auditoria</text>

  <line x1="604" y1="273" x2="498" y2="273" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="288" y="230" width="210" height="86" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="393" y="258" font-size="13" font-weight="800" fill="#F97316" text-anchor="middle">Mistral via Ollama</text>
  <text x="393" y="280" font-size="11" fill="#92400E" text-anchor="middle">temperatura 0.1</text>
  <text x="393" y="296" font-size="11" fill="#92400E" text-anchor="middle">responde só com contexto</text>

  <line x1="288" y1="273" x2="182" y2="273" stroke="#64748B" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="40" y="230" width="142" height="86" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="111" y="258" font-size="13" font-weight="800" fill="#0F766E" text-anchor="middle">Resposta</text>
  <text x="111" y="280" font-size="11" fill="#0B4F4A" text-anchor="middle">fontes citadas</text>
  <text x="111" y="296" font-size="11" fill="#0B4F4A" text-anchor="middle">score médio</text>

  <rect x="56" y="368" width="360" height="102" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="76" y="396" font-size="13" font-weight="800" fill="#172033">Proteções contra alucinação</text>
  <text x="76" y="420" font-size="11" fill="#64748B">1. Responder apenas com o contexto recuperado</text>
  <text x="76" y="438" font-size="11" fill="#64748B">2. Informar quando a base não sustenta a pergunta</text>
  <text x="76" y="456" font-size="11" fill="#64748B">3. Priorizar regras restritivas em caso de dúvida fiscal</text>

  <rect x="484" y="368" width="360" height="102" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="504" y="396" font-size="13" font-weight="800" fill="#172033">Por que o re-ranking ajuda</text>
  <text x="504" y="420" font-size="11" fill="#64748B">1. Captura negações como "não é dedutível"</text>
  <text x="504" y="438" font-size="11" fill="#64748B">2. Reordena trechos por relação direta com a pergunta</text>
  <text x="504" y="456" font-size="11" fill="#64748B">3. Reduz contexto irrelevante enviado ao LLM</text>

  <path d="M511 182 C511 198 511 214 511 230" fill="none" stroke="#F97316" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#setaLaranja)"/>
  <text x="526" y="214" font-size="10" fill="#F97316">candidatos recuperados</text>
</svg>
