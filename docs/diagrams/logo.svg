<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F766E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fundo branco -->
  <rect width="360" height="88" fill="white"/>

  <!-- Icone: quadrado teal arredondado -->
  <rect x="8" y="8" width="68" height="68" rx="14" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <!-- Folha de documento (branca) dentro do icone -->
  <rect x="20" y="18" width="36" height="46" rx="4" fill="white" opacity="0.95"/>
  <!-- Dobra de canto (folded corner) -->
  <polygon points="44,18 56,30 44,30" fill="#E0F2FE" opacity="0.9"/>
  <polygon points="44,18 56,18 56,30" fill="#BAE6FD" opacity="0.6"/>
  <!-- Linhas simulando texto no documento -->
  <rect x="24" y="34" width="22" height="2.5" rx="1.2" fill="#0F766E" opacity="0.5"/>
  <rect x="24" y="40" width="28" height="2.5" rx="1.2" fill="#0F766E" opacity="0.35"/>
  <rect x="24" y="46" width="18" height="2.5" rx="1.2" fill="#0F766E" opacity="0.35"/>
  <rect x="24" y="52" width="24" height="2.5" rx="1.2" fill="#0F766E" opacity="0.25"/>

  <!-- Badge laranja "AI" no canto superior direito do icone -->
  <circle cx="65" cy="15" r="10" fill="#F97316"/>
  <text x="65" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="white" text-anchor="middle">AI</text>

  <!-- Texto principal: DeclarAI -->
  <text x="94" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F766E">Declar</tspan><tspan fill="#F97316">AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="96" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" letter-spacing="2.2" font-weight="600">ASSISTENTE FISCAL INTELIGENTE</text>

  <!-- Linha decorativa abaixo da tagline -->
  <line x1="96" y1="78" x2="350" y2="78" stroke="#0F766E" stroke-width="1.5" opacity="0.18"/>
</svg>
