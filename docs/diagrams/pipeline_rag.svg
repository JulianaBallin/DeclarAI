  <text x="117" y="64" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FF6B35">FASE 1 - INGESTÃO (offline)</text>

  <!-- Node: Documentos (x=42, w=145, h=95) -->
