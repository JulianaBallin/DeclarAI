
# ============================================================
# DeclarAI - Docker Compose
#
# Serviços:
#   - backend  : API FastAPI com pipeline RAG (porta 8000)
#   - frontend : Interface React + Nginx (porta 3000)
#   - ollama   : Servidor de LLM local (porta 11434)
#
# Volumes persistentes:
#   - ./data        : uploads, base de conhecimento e ChromaDB
#   - ollama_models : modelos do Ollama baixados
# ============================================================

services:

  # ----------------------------------------------------------
  # Backend - FastAPI + RAG
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: declarai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/declarai.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODELO=mistral
      - MODELO_EMBEDDINGS=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - CAMINHO_CHROMA=./data/chroma_db
      - CAMINHO_BASE_CONHECIMENTO=./data/knowledge_base
      - CAMINHO_UPLOADS=./data/uploads
      - CHUNK_SIZE=600
      - CHUNK_OVERLAP=80
      - TOP_K_RESULTADOS=5
      - DEBUG=false
      - HF_HUB_DISABLE_XET=1
    volumes:
      # Monta o diretório de dados do host no contêiner
      - ./data:/app/data
    extra_hosts:
      # Evita falha de DNS ao baixar pesos do HuggingFace/Xet no ambiente de demo.
      - "cas-bridge.xethub.hf.co:3.171.38.25"
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - declarai-net

  # ----------------------------------------------------------
  # Frontend - React + Vite (build) + Nginx (serve)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL não é necessário em Docker pois o nginx faz proxy de /api
        # para o backend internamente. Deixado aqui para referência.
        VITE_API_URL: ""
    container_name: declarai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - declarai-net

  # ----------------------------------------------------------
  # Ollama - Servidor de LLM local
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: declarai-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persiste modelos baixados entre reinicializações
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - declarai-net

# ----------------------------------------------------------
# Rede interna
# ----------------------------------------------------------
networks:
  declarai-net:
    driver: bridge

# ----------------------------------------------------------
# Volumes nomeados
# ----------------------------------------------------------
volumes:
  ollama_models:
    driver: local
